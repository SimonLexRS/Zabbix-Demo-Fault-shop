# The only exit of the store's telemetry: the backend services send OTLP gRPC here (:4317), the browser (RUM) sends
# OTLP/HTTP to /otlp and nginx forwards it here (:4318). This Collector, the only store service on the Zabbix network,
# relays everything over gRPC to APM_GRPC_ENDPOINT (zabbix-proxy-apm:4317, the Zabbix 8.0 proxy, gRPC only).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  otlp:
    endpoint: ${env:APM_GRPC_ENDPOINT}
    tls:
      insecure: ${env:APM_TLS_INSECURE}

service:
  telemetry:
    logs:
      level: warn
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp]
