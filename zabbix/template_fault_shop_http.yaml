zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 'a1995398eae7447a9f076e30ac10beba'
      name: 'Templates/Applications'
  templates:
    - uuid: '256d9e1347d24b09bd60f1e2678ef5e0'
      template: 'Fault Shop by HTTP'
      name: 'Fault Shop by HTTP'
      description: 'Fault Shop: tienda demo de microservicios con panel de fallas. Datos por HTTP agent desde {$FAULTSHOP.URL}/api/metrics. Las trazas OpenTelemetry van al host APM (template OpenTelemetry application by OTLP). https://github.com/SimonLexRS/Zabbix-Demo-Fault-shop'
      groups:
        - name: 'Templates/Applications'
      items:
        - uuid: '188c642e4827491982e63eb3c8ed5a2f'
          name: 'Fault Shop: datos crudos (/api/metrics)'
          type: 'HTTP_AGENT'
          key: 'fshop.raw'
          delay: '{$FAULTSHOP.INTERVAL}'
          history: '0'
          value_type: 'TEXT'
          trends: '0'
          url: '{$FAULTSHOP.URL}/api/metrics'
          timeout: '10s'
          tags:
            - tag: 'component'
              value: 'raw'
        - uuid: '80572a9576304c218c0b08ef4d21ef30'
          name: 'Fault Shop: latido del bridge'
          type: 'DEPENDENT'
          key: 'fshop.bridge.heartbeat'
          delay: '0'
          value_type: 'UNSIGNED'
          units: 'unixtime'
          description: 'Hora de la última recolección de zabbix-bridge. Sin datos = la app no está enviando.'
          preprocessing:
            - type: 'JSONPATH'
              parameters:
                - '$.bridge[''heartbeat'']'
              error_handler: 'DISCARD_VALUE'
          master_item:
            key: 'fshop.raw'
          tags:
            - tag: 'component'
              value: 'general'
          triggers:
            - uuid: '045b6020df314654b46d4122743b2a78'
              expression: 'nodata(/Fault Shop by HTTP/fshop.bridge.heartbeat,{$FAULTSHOP.NODATA})=1'
              name: 'Fault Shop: zabbix-bridge sin datos'
              priority: 'HIGH'
              description: 'El bridge dejó de enviar (contenedor detenido, sin red hacia Zabbix o token inválido). Los demás triggers de este host dependen de este.'
              tags:
                - tag: 'component'
                  value: 'general'
        - uuid: '9aeab17b4de1416cb03b3107e7df9c15'
          name: 'Redis: disponible'
          type: 'DEPENDENT'
          key: 'fshop.redis.up'
          delay: '0'
          value_type: 'UNSIGNED'
          valuemap:
            name: 'Fault Shop: estado'
          preprocessing:
            - type: 'JSONPATH'
              parameters:
                - '$.redis[''up'']'
              error_handler: 'DISCARD_VALUE'
          master_item:
            key: 'fshop.raw'
          tags:
            - tag: 'component'
              value: 'redis'
          triggers:
            - uuid: '004f4af80fcd451d895dbc2b00e48fd8'
              expression: 'max(/Fault Shop by HTTP/fshop.redis.up,#2)=0'
              name: 'Redis: caído'
              priority: 'DISASTER'
              description: 'Sin Redis no hay carritos ni cola de e-mails.'
              dependencies:
                - name: 'Fault Shop: zabbix-bridge sin datos'
                  expression: 'nodata(/Fault Shop by HTTP/fshop.bridge.heartbeat,{$FAULTSHOP.NODATA})=1'
              tags:
                - tag: 'component'
                  value: 'redis'
        - uuid: '4abe32e8f65c412cb82984b89bc7043b'
          name: 'Redis: pedidos en cola (orders)'
          type: 'DEPENDENT'
          key: 'fshop.redis.queue_len'
          delay: '0'
          value_type: 'UNSIGNED'
          preprocessing:
            - type: 'JSONPATH'
              parameters:
                - '$.redis[''queue_len'']'
              error_handler: 'DISCARD_VALUE'
          master_item:
            key: 'fshop.raw'
          tags:
            - tag: 'component'
              value: 'redis'
          triggers:
            - uuid: '69291cdd132d4b74bfb07d0e618e89ef'
              expression: 'min(/Fault Shop by HTTP/fshop.redis.queue_len,2m)>{$FAULTSHOP.QUEUE.MAX}'
              name: 'Cola de e-mails acumulada (> {$FAULTSHOP.QUEUE.MAX} pedidos)'
              opdata: 'En cola: {ITEM.LASTVALUE1}'
              priority: 'AVERAGE'
              description: 'notifier no procesa al ritmo de los pedidos: fault "Cola de e-mail lenta" o notifier caído.'
              dependencies:
                - name: 'Fault Shop: zabbix-bridge sin datos'
                  expression: 'nodata(/Fault Shop by HTTP/fshop.bridge.heartbeat,{$FAULTSHOP.NODATA})=1'
              tags:
                - tag: 'component'
                  value: 'notifier'
        - uuid: '0fda1417e7374d648445d7e3c4070f66'
