      discovery_rules:
        - uuid: '01c2f1e06d5d4853a761bd6fecaa12fa'
          name: 'Servicios de la tienda'
          type: 'DEPENDENT'
          key: 'fshop.svc.discovery'
          delay: '0'
          description: 'Servicios HTTP de Fault Shop con health check (web, shop, catalog, checkout, payment, bank).'
          item_prototypes:
            - uuid: '4100e9284d1341d196c097fb586dbdd0'
              name: 'Servicio {#SVC}: disponible'
              type: 'DEPENDENT'
              key: 'fshop.svc.up[{#SVC}]'
              delay: '0'
              value_type: 'UNSIGNED'
              valuemap:
                name: 'Fault Shop: estado'
              preprocessing:
                - type: 'JSONPATH'
                  parameters:
                    - '$.services[''{#SVC}''].up'
                  error_handler: 'DISCARD_VALUE'
              master_item:
                key: 'fshop.raw'
              tags:
                - tag: 'component'
                  value: 'servicios'
                - tag: 'servicio'
                  value: '{#SVC}'
              trigger_prototypes:
                - uuid: '5d18b436b6084f64a199086496d613b5'
                  expression: 'max(/Fault Shop by HTTP/fshop.svc.up[{#SVC}],#2)=0'
                  name: 'Servicio {#SVC}: caído'
                  priority: 'HIGH'
                  description: '{#ROLE}. El health check no responde 200: fault "down" del panel, contenedor detenido o error.'
                  dependencies:
                    - name: 'Fault Shop: zabbix-bridge sin datos'
                      expression: 'nodata(/Fault Shop by HTTP/fshop.bridge.heartbeat,{$FAULTSHOP.NODATA})=1'
                  tags:
                    - tag: 'component'
                      value: 'servicios'
                    - tag: 'servicio'
                      value: '{#SVC}'
            - uuid: '39f62e868356409cb6d2190c4aeb9c6e'
              name: 'Servicio {#SVC}: tiempo de respuesta'
              type: 'DEPENDENT'
              key: 'fshop.svc.rt_ms[{#SVC}]'
              delay: '0'
              value_type: 'FLOAT'
              units: 'ms'
              preprocessing:
                - type: 'JSONPATH'
                  parameters:
                    - '$.services[''{#SVC}''].rt_ms'
                  error_handler: 'DISCARD_VALUE'
              master_item:
                key: 'fshop.raw'
              tags:
                - tag: 'component'
                  value: 'servicios'
                - tag: 'servicio'
                  value: '{#SVC}'
              trigger_prototypes:
                - uuid: '7cb1536a53fb47f6b02f37f7490014b2'
                  expression: 'min(/Fault Shop by HTTP/fshop.svc.rt_ms[{#SVC}],1m)>{$FAULTSHOP.RT.MAX}'
                  name: 'Servicio {#SVC}: health check lento (> {$FAULTSHOP.RT.MAX} ms)'
                  opdata: 'Respuesta: {ITEM.LASTVALUE1}'
                  priority: 'WARNING'
                  tags:
                    - tag: 'component'
                      value: 'servicios'
                    - tag: 'servicio'
                      value: '{#SVC}'
            - uuid: 'd4fc3739822c4dc7be9b301a9396e23a'
              name: 'Servicio {#SVC}: código HTTP'
              type: 'DEPENDENT'
              key: 'fshop.svc.http_code[{#SVC}]'
              delay: '0'
              value_type: 'UNSIGNED'
              preprocessing:
                - type: 'JSONPATH'
                  parameters:
                    - '$.services[''{#SVC}''].http_code'
                  error_handler: 'DISCARD_VALUE'
              master_item:
                key: 'fshop.raw'
              tags:
                - tag: 'component'
                  value: 'servicios'
                - tag: 'servicio'
                  value: '{#SVC}'
          master_item:
            key: 'fshop.raw'
          preprocessing:
            - type: 'JSONPATH'
              parameters:
                - '$.discovery.services'
      tags:
        - tag: 'class'
          value: 'application'
        - tag: 'target'
          value: 'fault-shop'
      macros:
        - macro: '{$FAULTSHOP.NODATA}'
          value: '2m'
          description: 'Tiempo sin datos del bridge antes de alertar.'
        - macro: '{$FAULTSHOP.RT.MAX}'
          value: '2000'
          description: 'Tiempo máximo de respuesta del health check (ms).'
        - macro: '{$FAULTSHOP.QUEUE.MAX}'
          value: '20'
          description: 'Pedidos en cola de e-mails tolerados durante 2 min.'
        - macro: '{$FAULTSHOP.PG.CONN.MAX}'
          value: '80'
          description: 'Conexiones máximas a PostgreSQL.'
        - macro: '{$FAULTSHOP.NOTIFIER.MAX}'
          value: '60'
          description: 'Segundos sin ciclo del worker notifier.'
        - macro: '{$FAULTSHOP.ORDERS.WINDOW}'
          value: '3m'
          description: 'Ventana sin pedidos (con carga simulada activa) antes de alertar.'
        - macro: '{$FAULTSHOP.URL}'
          value: 'http://zabbix-bridge:8000'
          description: 'URL base del zabbix-bridge (sin / final).'
        - macro: '{$FAULTSHOP.INTERVAL}'
          value: '30s'
          description: 'Intervalo del HTTP agent.'
      valuemaps:
        - uuid: '4f727a80b4704d358b818347caf6967c'
          name: 'Fault Shop: estado'
          mappings:
            - value: '0'
              newvalue: 'Caído'
            - value: '1'
              newvalue: 'Disponible'
        - uuid: 'fddce1e49c7f4492a48733e3e61d1c85'
          name: 'Fault Shop: sí/no'
          mappings:
            - value: '0'
              newvalue: 'No'
            - value: '1'
              newvalue: 'Sí'
  triggers:
    - uuid: '33932c6b87754ceab2f0755fece166b8'
      expression: 'max(/Fault Shop by HTTP/fshop.orders.per_min,{$FAULTSHOP.ORDERS.WINDOW})=0 and last(/Fault Shop by HTTP/fshop.fault[load_rps])>0'
      name: 'Fault Shop: sin pedidos con clientes simulados activos'
      priority: 'AVERAGE'
      description: 'loadgen genera tráfico pero ningún pedido llega a PostgreSQL: la compra está rota en algún punto (pagos, stock, servicio caído). Ver trazas en APM.'
      dependencies:
        - name: 'Fault Shop: zabbix-bridge sin datos'
          expression: 'nodata(/Fault Shop by HTTP/fshop.bridge.heartbeat,{$FAULTSHOP.NODATA})=1'
      tags:
        - tag: 'component'
          value: 'negocio'
