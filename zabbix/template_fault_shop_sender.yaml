      discovery_rules:
        - uuid: '9c0c4a34d9ab4c40a0974c3cea6bed9e'
          name: 'Servicios de la tienda'
          type: 'TRAP'
          key: 'fshop.svc.discovery'
          description: 'Servicios HTTP de Fault Shop con health check (web, shop, catalog, checkout, payment, bank).'
          item_prototypes:
            - uuid: 'ef76de6ffcdc449ba518fa8eb4b9b57b'
              name: 'Servicio {#SVC}: disponible'
              type: 'TRAP'
              key: 'fshop.svc.up[{#SVC}]'
              value_type: 'UNSIGNED'
              valuemap:
                name: 'Fault Shop: estado'
              tags:
                - tag: 'component'
                  value: 'servicios'
                - tag: 'servicio'
                  value: '{#SVC}'
              trigger_prototypes:
                - uuid: '08df233a56be429589e35138f6b43573'
                  expression: 'max(/Fault Shop by Zabbix sender/fshop.svc.up[{#SVC}],#2)=0'
                  name: 'Servicio {#SVC}: caído'
                  priority: 'HIGH'
                  description: '{#ROLE}. El health check no responde 200: fault "down" del panel, contenedor detenido o error.'
                  dependencies:
                    - name: 'Fault Shop: zabbix-bridge sin datos'
                      expression: 'nodata(/Fault Shop by Zabbix sender/fshop.bridge.heartbeat,{$FAULTSHOP.NODATA})=1'
                  tags:
                    - tag: 'component'
                      value: 'servicios'
                    - tag: 'servicio'
                      value: '{#SVC}'
            - uuid: '34e456bb5d014ca797cd3c1257e66f80'
              name: 'Servicio {#SVC}: tiempo de respuesta'
              type: 'TRAP'
              key: 'fshop.svc.rt_ms[{#SVC}]'
              value_type: 'FLOAT'
              units: 'ms'
              tags:
                - tag: 'component'
                  value: 'servicios'
                - tag: 'servicio'
                  value: '{#SVC}'
              trigger_prototypes:
                - uuid: 'e00154a1511a46d3b51173e6fb8b5177'
                  expression: 'min(/Fault Shop by Zabbix sender/fshop.svc.rt_ms[{#SVC}],1m)>{$FAULTSHOP.RT.MAX}'
                  name: 'Servicio {#SVC}: health check lento (> {$FAULTSHOP.RT.MAX} ms)'
                  opdata: 'Respuesta: {ITEM.LASTVALUE1}'
                  priority: 'WARNING'
                  tags:
                    - tag: 'component'
                      value: 'servicios'
                    - tag: 'servicio'
                      value: '{#SVC}'
            - uuid: '5b9a57bcde79429499d9f160f689a13d'
              name: 'Servicio {#SVC}: código HTTP'
              type: 'TRAP'
              key: 'fshop.svc.http_code[{#SVC}]'
              value_type: 'UNSIGNED'
              tags:
                - tag: 'component'
                  value: 'servicios'
                - tag: 'servicio'
                  value: '{#SVC}'
      tags:
        - tag: 'class'
          value: 'application'
        - tag: 'target'
          value: 'fault-shop'
      macros:
        - macro: '{$FAULTSHOP.NODATA}'
          value: '2m'
          description: 'Tiempo sin datos del bridge antes de alertar.'
        - macro: '{$FAULTSHOP.RT.MAX}'
          value: '2000'
          description: 'Tiempo máximo de respuesta del health check (ms).'
        - macro: '{$FAULTSHOP.QUEUE.MAX}'
          value: '20'
          description: 'Pedidos en cola de e-mails tolerados durante 2 min.'
        - macro: '{$FAULTSHOP.PG.CONN.MAX}'
          value: '80'
          description: 'Conexiones máximas a PostgreSQL.'
        - macro: '{$FAULTSHOP.NOTIFIER.MAX}'
          value: '60'
          description: 'Segundos sin ciclo del worker notifier.'
        - macro: '{$FAULTSHOP.ORDERS.WINDOW}'
          value: '3m'
