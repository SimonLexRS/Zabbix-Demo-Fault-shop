zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: '506ca6f8f7ac4e0a96a98722d9f75959'
      name: 'Templates/Applications'
  templates:
    - uuid: '1f5c72ef7cd642a5b32cd15512b09f4a'
      template: 'Fault Shop by Zabbix sender'
      name: 'Fault Shop by Zabbix sender'
      description: 'Fault Shop: tienda demo de microservicios con panel de fallas. Datos enviados por zabbix-bridge (history.push o Zabbix sender, ítems trapper). Las trazas OpenTelemetry van al host APM (template OpenTelemetry application by OTLP). https://github.com/SimonLexRS/Zabbix-Demo-Fault-shop'
      groups:
        - name: 'Templates/Applications'
      items:
        - uuid: 'c3420b782cbe41b58e8a5859c1fc5963'
          name: 'Fault Shop: latido del bridge'
          type: 'TRAP'
          key: 'fshop.bridge.heartbeat'
          value_type: 'UNSIGNED'
          units: 'unixtime'
          description: 'Hora de la última recolección de zabbix-bridge. Sin datos = la app no está enviando.'
          tags:
            - tag: 'component'
              value: 'general'
          triggers:
            - uuid: '3da0841d252041fd9c25e9bcc8753fab'
              expression: 'nodata(/Fault Shop by Zabbix sender/fshop.bridge.heartbeat,{$FAULTSHOP.NODATA})=1'
              name: 'Fault Shop: zabbix-bridge sin datos'
              priority: 'HIGH'
              description: 'El bridge dejó de enviar (contenedor detenido, sin red hacia Zabbix o token inválido). Los demás triggers de este host dependen de este.'
              tags:
                - tag: 'component'
                  value: 'general'
        - uuid: '05aa8b8a1c8840e99b8cb4c16f90a8b4'
          name: 'Redis: disponible'
          type: 'TRAP'
          key: 'fshop.redis.up'
          value_type: 'UNSIGNED'
          valuemap:
            name: 'Fault Shop: estado'
          tags:
            - tag: 'component'
              value: 'redis'
          triggers:
            - uuid: '03770e03513a4c4a9f4823dcdbe5f898'
              expression: 'max(/Fault Shop by Zabbix sender/fshop.redis.up,#2)=0'
              name: 'Redis: caído'
              priority: 'DISASTER'
              description: 'Sin Redis no hay carritos ni cola de e-mails.'
              dependencies:
                - name: 'Fault Shop: zabbix-bridge sin datos'
                  expression: 'nodata(/Fault Shop by Zabbix sender/fshop.bridge.heartbeat,{$FAULTSHOP.NODATA})=1'
              tags:
                - tag: 'component'
                  value: 'redis'
        - uuid: '8634aa2a8bbe4ad4a4d98d85e73ec58b'
          name: 'Redis: pedidos en cola (orders)'
          type: 'TRAP'
          key: 'fshop.redis.queue_len'
          value_type: 'UNSIGNED'
          tags:
            - tag: 'component'
              value: 'redis'
          triggers:
            - uuid: '5cc2e7e5cbe24cca8453c1c58c57b5e1'
              expression: 'min(/Fault Shop by Zabbix sender/fshop.redis.queue_len,2m)>{$FAULTSHOP.QUEUE.MAX}'
              name: 'Cola de e-mails acumulada (> {$FAULTSHOP.QUEUE.MAX} pedidos)'
              opdata: 'En cola: {ITEM.LASTVALUE1}'
              priority: 'AVERAGE'
              description: 'notifier no procesa al ritmo de los pedidos: fault "Cola de e-mail lenta" o notifier caído.'
              dependencies:
                - name: 'Fault Shop: zabbix-bridge sin datos'
                  expression: 'nodata(/Fault Shop by Zabbix sender/fshop.bridge.heartbeat,{$FAULTSHOP.NODATA})=1'
              tags:
                - tag: 'component'
                  value: 'notifier'
        - uuid: '96b7da44cd27419da8806d5d5d20c590'
          name: 'Redis: carritos abiertos'
          type: 'TRAP'
          key: 'fshop.redis.carts'
          value_type: 'UNSIGNED'
          tags:
            - tag: 'component'
              value: 'redis'
        - uuid: 'ae76461285434f9d89711e9c4bc013a0'
          name: 'Redis: memoria usada'
          type: 'TRAP'
          key: 'fshop.redis.used_memory'
          value_type: 'UNSIGNED'
          units: 'B'
          tags:
            - tag: 'component'
              value: 'redis'
        - uuid: '77413941da3b4fa5b6eb46950d3f0d11'
          name: 'Redis: clientes conectados'
          type: 'TRAP'
          key: 'fshop.redis.clients'
          value_type: 'UNSIGNED'
          tags:
            - tag: 'component'
              value: 'redis'
        - uuid: '3db41b049f364ded9d235deb7f15f00f'
          name: 'Redis: operaciones por segundo'
          type: 'TRAP'
          key: 'fshop.redis.ops_per_sec'
          value_type: 'FLOAT'
          units: 'ops'
          tags:
            - tag: 'component'
              value: 'redis'
        - uuid: '6b83f1f8915b416ab9901a26519e39fe'
          name: 'PostgreSQL: disponible'
          type: 'TRAP'
          key: 'fshop.pg.up'
          value_type: 'UNSIGNED'
          valuemap:
            name: 'Fault Shop: estado'
          tags:
            - tag: 'component'
              value: 'postgres'
          triggers:
            - uuid: 'ad394a05e6bc408aa3c93ba2da0d0de9'
              expression: 'max(/Fault Shop by Zabbix sender/fshop.pg.up,#2)=0'
              name: 'PostgreSQL: caído'
              priority: 'DISASTER'
              dependencies:
                - name: 'Fault Shop: zabbix-bridge sin datos'
                  expression: 'nodata(/Fault Shop by Zabbix sender/fshop.bridge.heartbeat,{$FAULTSHOP.NODATA})=1'
              tags:
                - tag: 'component'
                  value: 'postgres'
        - uuid: '3d6ba000c0fe4536abed58db51cd316f'
